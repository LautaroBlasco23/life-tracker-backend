version: "2"
run:
  timeout: 5m
  tests: false
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - gosec
    - gocyclo
    - gocritic
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
    gocyclo:
      min-complexity: 15
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks: [rangeValCopy]
    gosec:
      excludes: [G404]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

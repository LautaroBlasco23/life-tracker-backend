version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: golang_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: golang_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golang_api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - golang_api_network

volumes:
  postgres_data:
    driver: local

networks:
  golang_api_network:
    driver: bridge

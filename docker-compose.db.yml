services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-golang_api_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_VOLUME_NAME:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ${NETWORK_NAME:-golang_api_network}

  mongodb:
    image: mongo:7.0
    container_name: ${MONGO_CONTAINER_NAME:-golang_api_mongodb}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MONGO_DATA_VOLUME_NAME:-mongodb_data}:/data/db
      - ${MONGO_CONFIG_VOLUME_NAME:-mongodb_config}:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ${NETWORK_NAME:-golang_api_network}

volumes:
  postgres_data:
    driver: local
  postgres_test_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_test_data:
    driver: local
  mongodb_config:
    driver: local
  mongodb_test_config:
    driver: local

networks:
  golang_api_network:
    driver: bridge
  golang_api_test_network:
    driver: bridge

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/lifetracker-backend
  GO_VERSION: "1.23"
  TEST_DB_PASSWORD: test_password
  TEST_DB_NAME: life_tracker_test
  TEST_MONGO_USER: test_user
  TEST_MONGO_PASSWORD: test_password
  TEST_MONGO_DB: life_tracker_test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ env.TEST_MONGO_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ env.TEST_MONGO_PASSWORD }}
          MONGO_INITDB_DATABASE: ${{ env.TEST_MONGO_DB }}
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install tools
        run: make install-tools

      - name: Run tests
        env:
          TEST_POSTGRES_DSN: postgres://postgres:${{ env.TEST_DB_PASSWORD }}@localhost:5433/${{ env.TEST_DB_NAME }}?sslmode=disable
          TEST_MONGO_URI: mongodb://${{ env.TEST_MONGO_USER }}:${{ env.TEST_MONGO_PASSWORD }}@localhost:27018
        run: make test-only

  build-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Upload endpoint files
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-files
          path: endpoints/
          retention-days: 7

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, homeserver, backend]
    steps:
      - name: Deploy backend service
        run: ~/deploy/infra/scripts/deploy-service.sh backend

      - name: Health check
        run: |
          sleep 5
          curl -f http://backend:8080/health || curl -f http://localhost:8080/health || exit 1
